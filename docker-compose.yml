name: conduit

services:
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  redis-2:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  redis-3:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6381:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Override when 5433 is taken by another project: POSTGRES_HOST_PORT=5434 make up
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    env_file:
      - .env
    # These override .env when set in the host shell, which is how
    # loadtest/measure.sh drives its A/B runs without rewriting .env.
    environment:
      REDIS_ADDRESSES: ${REDIS_ADDRESSES:-redis:6379,redis-2:6379,redis-3:6379}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      RECONCILER_RUNNING_LEASE: ${RECONCILER_RUNNING_LEASE:-5m}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      # measure.sh points these at a fresh topic per run. Reusing one topic
      # leaves an uncommitted backlog from the previous run for the consumer to
      # chew through, which silently starves the Kafka dispatch path.
      KAFKA_TOPIC: ${KAFKA_TOPIC:-conduit.jobs}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-conduit-workers}
      RECONCILER_ENABLED: ${RECONCILER_ENABLED:-true}
      RECONCILER_BATCH_SIZE: ${RECONCILER_BATCH_SIZE:-100}
      WORKER_QUEUE_SIZE: ${WORKER_QUEUE_SIZE:-256}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    restart: on-failure

  # Webhook target for loadtest/measure.sh. Only starts with `--profile loadtest`,
  # so a normal `make up` never pulls it. /status/200 answers POST immediately;
  # /delay/N holds the connection, which is how the crash test parks jobs in RUNNING.
  sink:
    image: mccutchen/go-httpbin:v2.15.0
    profiles: ["loadtest"]
    # No healthcheck: the image is distroless with no shell or curl, so
    # measure.sh polls http://localhost:8081/status/200 from the host instead.
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      # Override when 3000 is taken: GRAFANA_HOST_PORT=3001 make up
      - "${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  pgdata:
