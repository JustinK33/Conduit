name: conduit

# Plain `docker compose up` is Postgres, one migration run, and the app. Nothing
# else here is required to have a working Conduit:
#
#   --profile kafka         the Kafka transport (CONDUIT_TRANSPORT=kafka)
#   --profile redis         Redlock (CONDUIT_LOCK=redlock)
#   --profile observability Prometheus and Grafana
#   --profile loadtest      the webhook sink loadtest/measure.sh needs
#
# Compose rejects a depends_on pointing at a profiled service, so `app` depends
# on Postgres alone and tolerates Kafka and Redis being absent. That is enforced
# by config.Validate, which only requires a broker for the Kafka transport and
# only requires Redis addresses for Redlock.
services:
  kafka:
    image: apache/kafka:latest
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  redis-2:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  redis-3:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6381:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Override when 5433 is taken by another project: POSTGRES_HOST_PORT=5434 make up
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No initdb mount. The entrypoint runs exactly once, on first boot, on an
    # empty volume, so any migration added after a deployment existed would never
    # reach it. The `migrate` service below is the one migration mechanism.

  # Applies the schema, then exits. Runs on every `up`, which is safe: each
  # migration is applied once and recorded in schema_migrations, and an advisory
  # lock serialises concurrent runs.
  migrate:
    build: .
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CONDUIT_LOG_LEVEL: ${CONDUIT_LOG_LEVEL:-info}
    restart: "no"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    # These override .env when set in the host shell, which is how
    # loadtest/measure.sh drives its A/B runs without rewriting .env.
    environment:
      # Postgres-only by default. `--profile kafka` plus CONDUIT_TRANSPORT=kafka
      # and `--profile redis` plus CONDUIT_LOCK=redlock get the old stack back,
      # which is what measure.sh does for its A/B runs.
      CONDUIT_TRANSPORT: ${CONDUIT_TRANSPORT:-postgres}
      CONDUIT_LOCK: ${CONDUIT_LOCK:-advisory}
      CONDUIT_API_KEYS: ${CONDUIT_API_KEYS:-}
      CONDUIT_TRUSTED_PROXIES: ${CONDUIT_TRUSTED_PROXIES:-}
      CONDUIT_REDIS_ADDRESSES: ${CONDUIT_REDIS_ADDRESSES:-redis:6379,redis-2:6379,redis-3:6379}
      CONDUIT_WORKER_CONCURRENCY: ${CONDUIT_WORKER_CONCURRENCY:-8}
      CONDUIT_WORKER_QUEUES: ${CONDUIT_WORKER_QUEUES:-}
      CONDUIT_RECONCILER_RUNNING_LEASE: ${CONDUIT_RECONCILER_RUNNING_LEASE:-5m}
      CONDUIT_WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${CONDUIT_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      # measure.sh points these at a fresh topic per run. Reusing one topic
      # leaves an uncommitted backlog from the previous run for the consumer to
      # chew through, which silently starves the Kafka dispatch path.
      CONDUIT_KAFKA_TOPIC: ${CONDUIT_KAFKA_TOPIC:-conduit.jobs}
      CONDUIT_KAFKA_CONSUMER_GROUP: ${CONDUIT_KAFKA_CONSUMER_GROUP:-conduit-workers}
      CONDUIT_RECONCILER_ENABLED: ${CONDUIT_RECONCILER_ENABLED:-true}
      CONDUIT_RECONCILER_BATCH_SIZE: ${CONDUIT_RECONCILER_BATCH_SIZE:-500}
      CONDUIT_WORKER_QUEUE_SIZE: ${CONDUIT_WORKER_QUEUE_SIZE:-256}
      CONDUIT_LOG_LEVEL: ${CONDUIT_LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    restart: on-failure

  # Webhook target for loadtest/measure.sh. Only starts with `--profile loadtest`,
  # so a normal `make up` never pulls it. /status/200 answers POST immediately;
  # /delay/N holds the connection, which is how the crash test parks jobs in RUNNING.
  sink:
    image: mccutchen/go-httpbin:v2.15.0
    profiles: ["loadtest"]
    # No healthcheck: the image is distroless with no shell or curl, so
    # measure.sh polls http://localhost:8081/status/200 from the host instead.
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      # Override when 3000 is taken: GRAFANA_HOST_PORT=3001 make up
      - "${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  pgdata:
