apiVersion: v1
kind: ConfigMap
metadata:
  name: conduit-config
  labels:
    app: conduit
data:
  # Postgres-only: LISTEN/NOTIFY for wake-ups, pg_try_advisory_lock for the
  # execution guard. The Kafka and Redis settings below are inert at these
  # values and are kept so switching is a one-line change.
  CONDUIT_TRANSPORT: "postgres"
  CONDUIT_LOCK: "advisory"
  # Read only when CONDUIT_TRANSPORT: "kafka".
  CONDUIT_KAFKA_BROKERS: "kafka:9092"
  CONDUIT_KAFKA_TOPIC: "conduit.jobs"
  CONDUIT_KAFKA_CONSUMER_GROUP: "conduit-workers"
  CONDUIT_KAFKA_COMPRESSION_CODEC: "2"
  CONDUIT_KAFKA_FLUSH_FREQUENCY_MS: "5"
  CONDUIT_KAFKA_FLUSH_BYTES: "1048576"
  CONDUIT_KAFKA_CHANNEL_BUFFER_SIZE: "256"
  # Read only when CONDUIT_LOCK: "redlock".
  CONDUIT_REDIS_ADDRESSES: "redis-0:6379,redis-1:6379,redis-2:6379"
  CONDUIT_REDIS_POOL_SIZE: "10"
  CONDUIT_POSTGRES_MAX_CONNS: "10"
  CONDUIT_POSTGRES_MIN_CONNS: "1"
  CONDUIT_POSTGRES_MAX_CONN_LIFETIME: "30m"
  CONDUIT_POSTGRES_MAX_CONN_IDLE_TIME: "5m"
  CONDUIT_POSTGRES_HEALTH_CHECK_PERIOD: "1m"
  CONDUIT_WORKER_CONCURRENCY: "8"
  CONDUIT_WORKER_QUEUE_SIZE: "256"
  CONDUIT_WORKER_QUEUES: ""
  CONDUIT_RECONCILER_ENABLED: "true"
  CONDUIT_RECONCILER_INTERVAL: "1s"
  CONDUIT_RECONCILER_IDLE_INTERVAL: "15s"
  CONDUIT_RECONCILER_BATCH_SIZE: "100"
  CONDUIT_RECONCILER_RUNNING_LEASE: "5m"
  CONDUIT_WEBHOOK_TIMEOUT: "10s"
  CONDUIT_WEBHOOK_MAX_REDIRECTS: "0"
  CONDUIT_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "false"
  CONDUIT_HTTP_ADDRESS: ":8080"
  # Set to the pod network CIDR when an Ingress fronts this, so the logged
  # client_ip is the real caller rather than the ingress controller. Empty means
  # trust no X-Forwarded-For at all.
  CONDUIT_TRUSTED_PROXIES: ""
  CONDUIT_LOG_LEVEL: "info"
  CONDUIT_LOG_FORMAT: "json"
  CONDUIT_METRICS_NAMESPACE: "conduit"
  CONDUIT_METRICS_SUBSYSTEM: "server"
