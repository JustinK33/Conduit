apiVersion: v1
kind: ConfigMap
metadata:
  name: conduit-config
  labels:
    app: conduit
data:
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC: "conduit.jobs"
  KAFKA_CONSUMER_GROUP: "conduit-workers"
  KAFKA_COMPRESSION_CODEC: "2"
  KAFKA_FLUSH_FREQUENCY_MS: "5"
  KAFKA_FLUSH_BYTES: "1048576"
  KAFKA_CHANNEL_BUFFER_SIZE: "256"
  REDIS_ADDRESSES: "redis-0:6379,redis-1:6379,redis-2:6379"
  REDIS_POOL_SIZE: "10"
  POSTGRES_MAX_CONNS: "10"
  POSTGRES_MIN_CONNS: "1"
  POSTGRES_MAX_CONN_LIFETIME: "30m"
  POSTGRES_MAX_CONN_IDLE_TIME: "5m"
  POSTGRES_HEALTH_CHECK_PERIOD: "1m"
  WORKER_CONCURRENCY: "8"
  WORKER_QUEUE_SIZE: "256"
  WORKER_QUEUES: ""
  RECONCILER_ENABLED: "true"
  RECONCILER_INTERVAL: "1s"
  RECONCILER_IDLE_INTERVAL: "15s"
  RECONCILER_BATCH_SIZE: "100"
  RECONCILER_RUNNING_LEASE: "5m"
  WEBHOOK_TIMEOUT: "10s"
  WEBHOOK_MAX_REDIRECTS: "0"
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: "false"
  HTTP_ADDRESS: ":8080"
  # Set to the pod network CIDR when an Ingress fronts this, so the logged
  # client_ip is the real caller rather than the ingress controller. Empty means
  # trust no X-Forwarded-For at all.
  TRUSTED_PROXIES: ""
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_NAMESPACE: "conduit"
  METRICS_SUBSYSTEM: "server"
