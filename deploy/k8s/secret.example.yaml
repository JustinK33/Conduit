# This is a template for the conduit-secrets Secret.
#
# IMPORTANT: Copy this file to secret.yaml and fill in the real values.
# Do NOT commit secret.yaml - it should remain in .gitignore.
#
# To create the Secret in your cluster:
#   kubectl apply -f deploy/k8s/secret.yaml
#
# To generate a strong API key:
#   openssl rand -hex 32
#
apiVersion: v1
kind: Secret
metadata:
  name: conduit-secrets
  labels:
    app: conduit
type: Opaque
stringData:
  # Database connection string with credentials
  CONDUIT_POSTGRES_DSN: "postgres://conduit:CHANGE-ME-PASSWORD@postgres:5432/conduit?sslmode=require"

  # Redis password (leave empty if Redis has no auth)
  CONDUIT_REDIS_PASSWORD: ""

  # Comma-separated list of API keys for /api/jobs endpoints.
  # Generate with: openssl rand -hex 32
  # Leave empty to disable authentication (not recommended for production).
  CONDUIT_API_KEYS: "EXAMPLE-KEY-0123456789abcdef0123456789abcdef,EXAMPLE-KEY-fedcba9876543210fedcba9876543210"
