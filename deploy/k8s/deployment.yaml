apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduit
  labels:
    app: conduit
spec:
  replicas: 3
  selector:
    matchLabels:
      app: conduit
  template:
    metadata:
      labels:
        app: conduit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 35
      # Every replica runs this, and that is fine: migrations are recorded in
      # schema_migrations and serialised on an advisory lock, so the second and
      # third pods find nothing to do. An init container rather than a Job
      # because it also covers the rollout case, where a new image's schema has
      # to land before that image starts serving.
      initContainers:
        - name: migrate
          image: conduit:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: conduit-config
            - secretRef:
                name: conduit-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      containers:
        - name: conduit
          image: conduit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: conduit-config
            - secretRef:
                name: conduit-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 12
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
