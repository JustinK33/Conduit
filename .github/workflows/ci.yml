name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Compile
        run: go build -o bin/conduit ./cmd/server

      - name: Docker build
        run: docker build -t conduit:${{ github.sha }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: conduit-binary
          path: bin/conduit

  load-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: conduit-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/conduit

      - name: Start infrastructure
        run: |
          docker compose up -d --wait kafka redis redis-2 redis-3 postgres
          docker exec -i conduit-postgres-1 psql -U conduit -d conduit < migrations/001_create_jobs.sql

      - name: Start server
        env:
          CONDUIT_POSTGRES_DSN: postgres://conduit:conduit@localhost:5433/conduit?sslmode=disable
          CONDUIT_KAFKA_BROKERS: localhost:9092
          CONDUIT_KAFKA_TOPIC: jobs
          CONDUIT_REDIS_ADDRESSES: localhost:6379,localhost:6380,localhost:6381
          CONDUIT_WORKER_CONCURRENCY: "50"
          CONDUIT_WORKER_QUEUE_SIZE: "500"
          CONDUIT_KAFKA_COMPRESSION_CODEC: "2"
          CONDUIT_KAFKA_FLUSH_FREQUENCY_MS: "5"
          CONDUIT_KAFKA_FLUSH_BYTES: "1048576"
          CONDUIT_KAFKA_CHANNEL_BUFFER_SIZE: "256"
          CONDUIT_POSTGRES_MAX_CONNS: "50"
          CONDUIT_POSTGRES_MIN_CONNS: "10"
          CONDUIT_HTTP_ADDRESS: ":8080"
        run: |
          nohup bin/conduit > /tmp/conduit.log 2>&1 &
          echo $! > /tmp/conduit.pid
          echo "Waiting for server (max 90s)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/conduit.pid)" 2>/dev/null; then
              echo "server process exited"
              cat /tmp/conduit.log
              exit 1
            fi
            sleep 1
          done
          echo "server did not become healthy in 90s"
          cat /tmp/conduit.log
          exit 1

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest/k6.js
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Conduit logs (on failure)
        if: failure()
        run: cat /tmp/conduit.log || true
