name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

# Least privilege by default. push-image widens it to packages: write for
# itself, and nothing else in this workflow needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Compile
        run: go build -o bin/conduit ./cmd/server

      - name: Docker build
        run: docker build -t conduit:${{ github.sha }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: conduit-binary
          path: bin/conduit

  load-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: conduit-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/conduit

      # Postgres alone, which is the default configuration and so the one worth
      # load-testing. The Kafka and Redis paths are covered by unit tests and by
      # loadtest/measure.sh, which runs them explicitly for its A/B numbers.
      - name: Start infrastructure
        run: docker compose up -d --wait postgres

      - name: Apply migrations
        env:
          CONDUIT_POSTGRES_DSN: postgres://conduit:conduit@localhost:5433/conduit?sslmode=disable
        run: bin/conduit migrate

      - name: Start server
        env:
          CONDUIT_POSTGRES_DSN: postgres://conduit:conduit@localhost:5433/conduit?sslmode=disable
          CONDUIT_WORKER_CONCURRENCY: "50"
          CONDUIT_WORKER_QUEUE_SIZE: "500"
          CONDUIT_POSTGRES_MAX_CONNS: "50"
          CONDUIT_POSTGRES_MIN_CONNS: "10"
          CONDUIT_HTTP_ADDRESS: ":8080"
        run: |
          nohup bin/conduit > /tmp/conduit.log 2>&1 &
          echo $! > /tmp/conduit.pid
          echo "Waiting for server (max 90s)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/conduit.pid)" 2>/dev/null; then
              echo "server process exited"
              cat /tmp/conduit.log
              exit 1
            fi
            sleep 1
          done
          echo "server did not become healthy in 90s"
          cat /tmp/conduit.log
          exit 1

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest/k6.js
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Conduit logs (on failure)
        if: failure()
        run: cat /tmp/conduit.log || true

  # Publishing lives in this workflow rather than its own, because `needs:`
  # cannot cross workflow files. It used to be cd.yml, which ran in parallel
  # with this one, so a red test suite still shipped an image.
  push-image:
    runs-on: ubuntu-latest
    needs: load-test
    # Pull requests never publish. That is also what keeps forked PRs working,
    # since their GITHUB_TOKEN has no packages: write.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name, lowercased
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # A main push gets :main and the bare :<sha>. A v* tag additionally gets
      # :v1.2.3, :v1.2, and :latest, so :latest tracks the last release rather
      # than the tip of main - which is what someone reading
      # `docker run ghcr.io/.../conduit` expects to get.
      #
      # The v prefix is kept explicitly: {{version}} alone strips it, and the
      # tag in deploy/k8s and the README quickstart is written with the v.
      # latest=false plus one explicit raw tag, rather than latest=auto, so the
      # condition is readable here instead of being a documented default.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Conduit
            org.opencontainers.image.licenses=Apache-2.0

      # QEMU and buildx are what make the arm64 half of the matrix possible.
      # The Dockerfile reads TARGETARCH, so each platform gets a native binary.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
